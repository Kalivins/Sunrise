name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Release x64
    # The image carries Visual Studio 2026, so the project's own v145 toolset and its
    # 10.0.26100.0 SDK are both present. No toolset override.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild Sunrise.sln /m
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Release-x64
          path: |
            build/x64/Release/steam_api64.dll
            build/x64/Release/steam_api64.pdb
          if-no-files-found: error

  encounter-test:
    name: Encounter test x64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S Sunrise/tests -B build/tests -A x64

      - name: Build
        run: cmake --build build/tests --config Release

      - name: Run test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/tests -Recurse -Filter blueprint_activity_policy_test.exe | Select-Object -First 1
          if (-not $exe) { throw "test executable not found" }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "test failed (exit $LASTEXITCODE)" }
